<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ansari.co product details.">
  <title>Ansari.co | Product</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="index.html" aria-label="Ansari.co home">
        <img src="images/logo.png" alt="Ansari.co logo">
        <span>ANSARI<span class="gold">.CO</span></span>
      </a>
      <button class="menu-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="index.html#shop">Shop</a>
        <a href="index.html#about">About</a>
        <a href="index.html#contact">Contact</a>
      </nav>
      <a class="nav-cart" href="index.html#shop">Shop Now</a>
    </div>
  </header>

  <main class="product-page">
    <div class="container">
      <a class="back-link" href="index.html#shop">← Back to collection</a>

      <div class="product-detail" id="productDetail">
        <!-- Product content is inserted by product.js -->
      </div>

      <section class="related-section">
        <div class="section-heading">
          <div>
            <p class="eyebrow">YOU MAY ALSO LIKE</p>
            <h2>More from Ansari.co</h2>
          </div>
        </div>
        <div class="product-grid" id="relatedProducts"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <a class="brand footer-brand" href="index.html">
          <img src="images/logo.png" alt="Ansari.co logo">
          <span>ANSARI<span class="gold">.CO</span></span>
        </a>
        <p>Contemporary clothing made for confident everyday style.</p>
      </div>
      <div>
        <h3>Quick Links</h3>
        <a href="index.html">Home</a>
        <a href="index.html#shop">Shop</a>
        <a href="index.html#about">About</a>
      </div>
      <div>
        <h3>Contact</h3>
        <p>info@ansari.co</p>
        <p>Pakistan</p>
      </div>
    </div>
    <div class="footer-bottom">
      <div class="container">© 2026 Ansari.co. All rights reserved.</div>
    </div>
  </footer>

  <script src="script.js"></script>
  <script src="product.js"></script>
</body>
</html>
